name: Apple app

on:
  push:
    paths: ["apple/**", ".github/workflows/apple.yml"]
  pull_request:
    paths: ["apple/**", ".github/workflows/apple.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Core tests (rules, voice parser, speech text, Lichess payloads)
        working-directory: apple/VoiceChessCore
        run: swift test

      # The committed VoiceChess.xcodeproj is canonical; only generate it from project.yml if it's missing.
      - name: Generate Xcode project (if missing)
        run: |
          if [ ! -d VoiceChess.xcodeproj ]; then
            brew install xcodegen && xcodegen generate
          fi

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: VoiceChess-xcodeproj
          path: |
            apple/VoiceChess.xcodeproj
            apple/VoiceChess/Info.plist

      - name: Build for macOS
        run: >
          xcodebuild -project VoiceChess.xcodeproj -scheme VoiceChess
          -destination 'generic/platform=macOS' -configuration Debug
          CODE_SIGNING_ALLOWED=NO build

      - name: Build for iOS
        run: >
          xcodebuild -project VoiceChess.xcodeproj -scheme VoiceChess
          -destination 'generic/platform=iOS Simulator' -configuration Debug
          CODE_SIGNING_ALLOWED=NO build
