# XcodeGen spec: `brew install xcodegen && xcodegen generate` creates VoiceChess.xcodeproj.
name: VoiceChess
options:
  bundleIdPrefix: io.github.carnaticr
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  VoiceChessCore:
    path: VoiceChessCore

targets:
  VoiceChess:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: VoiceChess
    dependencies:
      - package: VoiceChessCore
    info:
      path: VoiceChess/Info.plist
      properties:
        CFBundleDisplayName: Voice Chess
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.board-games
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Voice Chess listens for the chess moves and commands you speak.
        NSSpeechRecognitionUsageDescription: Voice Chess turns what you say into chess moves. Recognition runs on this device when possible.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.carnaticr.voicechess
        PRODUCT_NAME: Voice Chess
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": VoiceChess/VoiceChess.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES

schemes:
  VoiceChess:
    build:
      targets:
        VoiceChess: all
    run:
      config: Debug
    archive:
      config: Release
